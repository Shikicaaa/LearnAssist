[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-learning"
version = "0.1.0"
description = "Platform for learning that utilises RAG and AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    # torch is installed SEPARATELY (CPU build, see README), otherwise pip pulls the large CUDA build.
    "sentence-transformers>=3",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "google-genai>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "import-linter>=2",
    "fpdf2>=2.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not slow and not live'"
markers = [
    "slow: uses the real embedding model (downloaded from the internet); run with -m slow",
    "live: calls a real external LLM API with the key from .env; run with -m live",
]
